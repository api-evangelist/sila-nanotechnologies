name: Sila Nanotechnologies
description: >-
  Sila Nanotechnologies is a next-generation battery materials company founded
  in 2011 and headquartered in Alameda, California, with a commercial-scale
  manufacturing plant in Moses Lake, Washington. Sila develops silicon-based
  anode materials — marketed as Titan Silicon — that replace conventional
  graphite anodes to increase the energy density of lithium-ion batteries used
  in consumer electronics, electric vehicles, and other applications. The
  company was surfaced as a portfolio company of 8VC and Bessemer Venture
  Partners and added to the API Evangelist network. Sila is a physical
  materials and manufacturing company and does not publish a public developer
  API, SDK, or documentation surface; this profile captures its public web and
  security posture only.
